# Ανεβάζει αυτόματα το site στο hosting του Papaki (diktiosi.gr)
# σε κάθε push στο main. Ανεβαίνουν μόνο τα αρχεία που άλλαξαν.
# Τα στοιχεία σύνδεσης βρίσκονται στα GitHub Secrets:
#   FTP_USERNAME, FTP_PASSWORD
name: Deploy to Papaki

on:
  push:
    branches: [main]
  workflow_dispatch: # χειροκίνητη εκτέλεση από την καρτέλα Actions

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FTP_HOST: diktip.ftp.tb-hosting.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Λήψη κώδικα
        uses: actions/checkout@v4

      - name: Εγκατάσταση lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Ανέβασμα μέσω FTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Ρυθμίσεις: απλό FTP (ο server δεν υποστηρίζει FTPS), κλασικό PASV, επαναπροσπάθειες
          SETTINGS="set ftp:ssl-allow no; set ftp:passive-mode yes; set ftp:prefer-epsv no; \
            set net:max-retries 5; set net:timeout 30; set net:reconnect-interval-base 5"

          # Βρίσκουμε αν η σύνδεση FTP ξεκινά έξω ή μέσα στον φάκελο www
          LISTING=$(lftp -c "$SETTINGS; open --env-password -u \"$FTP_USERNAME\" $FTP_HOST; cls -1")
          echo "Περιεχόμενα αρχικού φακέλου FTP:"
          echo "$LISTING"
          if echo "$LISTING" | grep -qxE 'www/?'; then TARGET=www; else TARGET=.; fi
          echo "Φάκελος προορισμού: $TARGET"

          lftp -c "$SETTINGS; open --env-password -u \"$FTP_USERNAME\" $FTP_HOST; \
            mirror --reverse --only-newer --verbose --parallel=2 \
              --exclude-glob .git* --exclude ^\.git/ --exclude ^\.github/ --exclude-glob README.md \
              ./ $TARGET"
