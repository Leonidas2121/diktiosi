# Ανεβάζει αυτόματα το site στο hosting του Papaki (diktiosi.gr)
# σε κάθε push στο main. Ανεβαίνουν μόνο τα αρχεία που άλλαξαν.
# Τα στοιχεία σύνδεσης βρίσκονται στα GitHub Secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy to Papaki

on:
  push:
    branches: [main]
  workflow_dispatch: # χειροκίνητη εκτέλεση από την καρτέλα Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Λήψη κώδικα
        uses: actions/checkout@v4

      - name: Ανέβασμα μέσω FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp # ο server του Papaki δεν υποστηρίζει FTPS
          server-dir: www/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
